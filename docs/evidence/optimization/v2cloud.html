    <style>

  <body>
    <div class="container">
      <div class="top">
        <div>
          <h1>线路检测</h1>
          <p>
            目标网址检测将在本页面内自动完成：自动选择最快可用目标展示到推荐区，其余目标按结果与延迟展示在列表中。
            <br />
          </p>
        </div>
        <div class="actions">
          <button id="btnTheme" class="chip" type="button">暗色</button>
        </div>
      </div>

      <div class="section">
        <div class="recommend">
          <div class="rec-left">
            <div class="title">推荐目标</div>
            <div id="recHost" class="host">检测中…</div>
            <div class="meta">
              <span id="recLatency" class="badge">延迟 -</span>
              <span id="recStatus" class="badge">状态 -</span>
            </div>
          </div>
          <div class="actions">
            <button id="btnRetest" class="btn secondary" type="button">重新检测</button>
            <button id="btnVisitBest" class="btn" type="button" disabled>访问</button>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="row">
          <div>
            <div class="title">检测目标网址</div>
          </div>
          <div class="row-right">
            <div id="countPill" class="pill-right">共 0 个</div>
            <button id="btnToggleList" class="btn secondary small" type="button">显示更多</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 52%">目标网址</th>
                <th style="width: 14%">状态</th>
                <th style="width: 14%">延迟</th>
                <th style="width: 20%; text-align: right">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="foot" id="footNote"></div>
      </div>
    </div>

    <script>
      const CONFIG = {
        timeoutMs: 4500,
        concurrency: 3,
        targets: [
          { name: "fast-v1.example.com", url: "https://fast-v1.example.com" },
          { name: "fast-v2.example.com", url: "https://fast-v2.example.com" },
          { name: "fast-v3.example.com", url: "https://fast-v3.example.com" },
          { name: "www.example.com", url: "https://www.example.com" }
        ]
      };

      const els = {
        recHost: document.getElementById("recHost"),
        recLatency: document.getElementById("recLatency"),
        recStatus: document.getElementById("recStatus"),
        tbody: document.getElementById("tbody"),
        btnVisitBest: document.getElementById("btnVisitBest"),
        btnRetest: document.getElementById("btnRetest"),
        btnTheme: document.getElementById("btnTheme"),
        countPill: document.getElementById("countPill"),
        btnToggleList: document.getElementById("btnToggleList"),
        footNote: document.getElementById("footNote")
      };

      const THEME_KEY = "nt_jump_theme";
      const DEFAULT_VISIBLE = 5;

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
        els.btnTheme.textContent = theme === "dark" ? "亮色" : "暗色";
      }

      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "dark" || saved === "light") return setTheme(saved);
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        setTheme(prefersDark ? "dark" : "light");
      }

      function safeUrl(raw) {
        try {
          const u = new URL(raw);
          return u.toString().replace(/\/$/, "");
        } catch {
          return raw;
        }
      }

      function hostFromUrl(raw) {
        try {
          return new URL(raw).host;
        } catch {
          return raw;
        }
      }

      function getTargets() {
        const raw = String(typeof DOMAIN_LIST === "string" ? DOMAIN_LIST : "").trim();
        const tokens = raw ? raw.split(/\s+/).filter(Boolean) : [];
        const items = tokens
          .map((t) => {
            const s = String(t || "").trim();
            if (!s) return null;
            if (/^https?:\/\//i.test(s)) {
              return { name: hostFromUrl(s), url: s, altUrl: null };
            }
            return { name: s, url: "https://" + s, altUrl: "http://" + s };
          })
          .filter(Boolean);
        if (items.length) return items;
        return CONFIG.targets.map((t) => ({ name: t.name || hostFromUrl(t.url), url: t.url }));
      }

      function getCode() {
        const s = new URLSearchParams(location.search).get("code");
        if (s) return s;
        if (location.hash) {
          const h = location.hash.replace(/^#/, "");
          const q = h.includes("?") ? h.split("?")[1] : h;
          if (q) {
            const v = new URLSearchParams(q).get("code");
            if (v) return v;
          }
        }
        return null;
      }

      function buildVisitUrl(rawUrl) {
        const code = getCode();
        try {
          const u = new URL(rawUrl);
          if (code) u.searchParams.set("code", code);
          return u.toString();
        } catch {
          if (!code) return rawUrl;
          return rawUrl + (rawUrl.includes("?") ? "&" : "?") + "code=" + encodeURIComponent(code);
        }
      }

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      function buildProbeUrl(rawUrl) {
        try {
          const u = new URL(rawUrl);
          return u.origin + "/favicon.ico?t=" + Date.now() + "_" + Math.random().toString(16).slice(2);
        } catch {
          const base = String(rawUrl || "").replace(/\/+$/, "");
          const sep = base.includes("?") ? "&" : "?";
          return base + sep + "t=" + Date.now() + "_" + Math.random().toString(16).slice(2);
        }
      }

      function probeUrl(rawUrl, timeoutMs) {
        const url = safeUrl(rawUrl);
        const t0 = performance.now();
        const probe = buildProbeUrl(url);
        return new Promise((resolve) => {
          let done = false;
          const img = new Image();
          const timer = setTimeout(() => {
            if (done) return;
            done = true;
            img.onload = null;
            img.onerror = null;
            resolve({ ok: false, latencyMs: null, reason: "超时" });
          }, timeoutMs);

          const finishOk = () => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            img.onload = null;
            img.onerror = null;
            const ms = Math.max(0, Math.round(performance.now() - t0));
            resolve({ ok: true, latencyMs: ms, reason: null });
          };

          img.onload = finishOk;
          img.onerror = finishOk;
          img.referrerPolicy = "no-referrer";
          img.decoding = "async";
          img.src = probe;
        });
      }

      function probeTarget(t, timeoutMs) {
        if (!t.altUrl) {
          return probeUrl(t.url, timeoutMs).then((r) => ({ ...r, url: t.url }));
        }
        return new Promise((resolve) => {
          let settled = false;
          let finished = 0;
          let lastFail = null;

          const handle = (candidateUrl) => (r) => {
            if (settled) return;
            finished += 1;
            if (r.ok) {
              settled = true;
              resolve({ ok: true, latencyMs: r.latencyMs, reason: null, url: candidateUrl });
              return;
            }
            lastFail = r;
            if (finished >= 2) {
              resolve({
                ok: false,
                latencyMs: null,
                reason: (lastFail && lastFail.reason) || "不可用",
                url: t.url
              });
            }
          };

          probeUrl(t.url, timeoutMs).then(handle(t.url));
          probeUrl(t.altUrl, timeoutMs).then(handle(t.altUrl));
        });
      }

      async function runPoolProgress(items, worker, concurrency, onItem) {
        const results = new Array(items.length);
        let nextIndex = 0;

        async function runner() {
          while (true) {
            const i = nextIndex++;
            if (i >= items.length) break;
            results[i] = await worker(items[i], i);
            if (onItem) onItem(results[i], i);
          }
        }

        const runners = Array.from({ length: Math.min(concurrency, items.length) }, runner);
        await Promise.all(runners);
        return results;
      }

      function sortRows(rows) {
        const copied = rows.slice();
        copied.sort((a, b) => {
          if (a.ok !== b.ok) return a.ok ? -1 : 1;
          if (a.ok && b.ok) return (a.latencyMs || 0) - (b.latencyMs || 0);
          return a.name.localeCompare(b.name);
        });
        return copied;
      }

      function renderTable(rows, bestUrl) {
        els.tbody.innerHTML = "";
        for (const r of rows) {
          const tr = document.createElement("tr");
          const tdUrl = document.createElement("td");
          const tdStatus = document.createElement("td");
          const tdLat = document.createElement("td");
          const tdOp = document.createElement("td");
          tdOp.className = "op";
          tdUrl.dataset.label = "目标网址";
          tdStatus.dataset.label = "状态";
          tdLat.dataset.label = "延迟";
          tdOp.dataset.label = "操作";

          const isBest = bestUrl && safeUrl(r.url) === safeUrl(bestUrl) && r.ok;

          tdUrl.innerHTML =
            '<span class="url">' +
            (r.name || hostFromUrl(r.url)) +
            (isBest ? ' <span class="badge">最优</span>' : "") +
            '</span><span class="small">' +
            safeUrl(r.url) +
            "</span>";

          tdStatus.innerHTML = r.ok
            ? '<span class="status-ok">可用</span>'
            : '<span class="status-bad">不可用</span>';

          if (r.ok) {
            const c = r.latencyMs <= 1200 ? "lat-ok" : "lat-bad";
            tdLat.innerHTML = '<span class="' + c + '">' + r.latencyMs + "ms</span>";
          } else {
            tdLat.innerHTML = '<span class="lat-bad">' + (r.reason || "超时") + "</span>";
          }

          if (r.ok) {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.type = "button";
            btn.textContent = "访问";
            btn.addEventListener("click", () => {
              window.location.href = buildVisitUrl(safeUrl(r.url));
            });
            tdOp.appendChild(btn);
          } else {
            tdOp.textContent = "";
          }

          tr.appendChild(tdUrl);
          tr.appendChild(tdStatus);
          tr.appendChild(tdLat);
          tr.appendChild(tdOp);
          els.tbody.appendChild(tr);
        }
      }

      function renderRecommend(best) {
        if (!best) {
          els.recHost.textContent = "暂无可用目标";
          els.recLatency.textContent = "延迟 -";
          els.recStatus.textContent = "状态 不可用";
          els.btnVisitBest.disabled = true;
          return;
        }
        els.recHost.textContent = best.name || hostFromUrl(best.url);
        els.recLatency.textContent = "延迟 " + best.latencyMs + "ms";
        els.recStatus.textContent = "状态 可用";
        els.btnVisitBest.disabled = false;
        els.btnVisitBest.onclick = () => {
          window.location.href = buildVisitUrl(safeUrl(best.url));
        };
      }

      let showAll = false;
      let lastRows = [];
      let lastBestUrl = null;
      let progressDone = 0;
      let progressTotal = 0;
      let renderScheduled = false;

      function updateCountAndToggle(total) {
        const prefix = running ? "检测中 " + progressDone + "/" + progressTotal + " · " : "";
        if (total <= DEFAULT_VISIBLE) {
          els.countPill.textContent = prefix + "共 " + total + " 个";
          els.btnToggleList.style.display = "none";
          return;
        }
        els.btnToggleList.style.display = "";
        const shown = showAll ? total : DEFAULT_VISIBLE;
        els.countPill.textContent = prefix + "显示 " + shown + "/共 " + total;
        els.btnToggleList.textContent = showAll ? "收起" : "显示更多";
      }

      function scheduleRender() {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => {
          renderScheduled = false;
          updateListView();
        });
      }

      function updateListView() {
        const total = lastRows.length;
        updateCountAndToggle(total);
        const visible = showAll ? lastRows : lastRows.slice(0, DEFAULT_VISIBLE);
        renderTable(visible, lastBestUrl);
      }

      function renderFoot(rows, timeoutMs) {
        const okCount = rows.filter((r) => r.ok).length;
        const badCount = rows.length - okCount;
        const code = getCode();
        els.footNote.textContent =
          "检测方式：浏览器侧图片探测（favicon），超时 " +
          timeoutMs +
          "ms；结果受网络、DNS、浏览器策略影响。可用 " +
          okCount +
          "，不可用 " +
          badCount +
          (code ? "。访问将透传 code 参数。" : "。");
      }

      let running = false;

      async function runDetection() {
        if (running) return;
        running = true;
        els.btnRetest.disabled = true;
        els.btnVisitBest.disabled = true;
        els.btnToggleList.disabled = true;
        showAll = false;
        progressDone = 0;

        els.recHost.textContent = "检测中…";
        els.recLatency.textContent = "延迟 -";
        els.recStatus.textContent = "状态 -";

        const targets = getTargets();
        progressTotal = targets.length;

        lastBestUrl = null;
        lastRows = targets.map((t) => ({ ...t, ok: false, latencyMs: null, reason: "检测中" }));
        updateListView();

        await sleep(30);

        let best = null;

        await runPoolProgress(
          targets,
          async (t) => {
            const res = await probeTarget(t, CONFIG.timeoutMs);
            return { ...t, ...res };
          },
          CONFIG.concurrency
          ,
          (row, i) => {
            progressDone += 1;
            lastRows[i] = { ...lastRows[i], ...row };
            if (row.ok && (!best || (row.latencyMs || 0) < (best.latencyMs || 0))) {
              best = lastRows[i];
              lastBestUrl = best.url;
              renderRecommend(best);
            }
            scheduleRender();
          }
        );

        const sorted = sortRows(lastRows);
        lastRows = sorted;
        best = sorted.find((r) => r.ok) || null;
        lastBestUrl = best ? best.url : null;
        renderRecommend(best);
        updateListView();
        renderFoot(sorted, CONFIG.timeoutMs);

        els.btnRetest.disabled = false;
        els.btnToggleList.disabled = false;
        running = false;
      }

      function bindEvents() {
        els.btnTheme.addEventListener("click", () => {
          const current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
          setTheme(current === "dark" ? "light" : "dark");
        });
        els.btnRetest.addEventListener("click", () => runDetection());
        els.btnToggleList.addEventListener("click", () => {
          showAll = !showAll;
          updateListView();
        });
      }

      initTheme();
      bindEvents();
      runDetection();
    </script>
  </body>
</html>
