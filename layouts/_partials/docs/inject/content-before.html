{{ if not .IsHome }}<nav class="breadcrumbs" aria-label="面包屑"><a href="/">首页</a> / {{ if .IsPage }}<a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a> / {{ end }}<span>{{ .Title }}</span></nav><h1>{{ .Title }}</h1><p class="page-meta">更新 {{ .Lastmod.Format "2006-01-02" }} · 机场手册编辑部</p>{{ end }}
{{ if .IsPage }}<div class="reading-tools" data-reading-title="{{ .Title }}" data-reading-url="{{ .RelPermalink }}"><button id="bookmark-toggle" type="button" aria-pressed="false" disabled>收藏本文</button><a href="/account/">查看收藏与阅读记录</a><span id="bookmark-status" role="status" aria-live="polite"></span></div>{{ end }}
